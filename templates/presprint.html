<!DOCTYPE html>
<html lang="zh-Hant">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pre-Sprint</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="page presprint-page">
    <section class="card presprint-card">
      <p class="eyebrow">7-Minute Sprint Reader</p>

      <button id="start-button" class="primary-button">開始閱讀</button>
    </section>
  </main>

  <script src="/static/js/presprint.js"></script>
